<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1e42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EduPortal · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: #0b1e42;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(59,130,246,0.4) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(14,165,233,0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(30,58,138,0.55) 0%, transparent 70%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
      padding-top: calc(24px + env(safe-area-inset-top));
      overflow-x: hidden;
      position: relative;
    }

    /* floating decorative orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 300px; height: 300px;
      background: #3b82f6;
      top: -110px; left: -110px;
      animation: float1 12s ease-in-out infinite;
    }
    body::after {
      width: 280px; height: 280px;
      background: #0ea5e9;
      bottom: -100px; right: -100px;
      animation: float2 14s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(30px, 20px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(-25px, -20px); }
    }

    .landing {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* ---- Brand / Header ---- */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 14px 32px -8px rgba(59,130,246,0.6),
        inset 0 2px 4px rgba(255,255,255,0.35),
        inset 0 -3px 6px rgba(0,0,0,0.18);
      position: relative;
    }
    .logo-badge::after {
      content:'';
      position:absolute;
      inset:0;
      border-radius:24px;
      border:1.5px solid rgba(255,255,255,0.28);
      pointer-events:none;
    }
    .logo-badge i {
      font-size: 34px;
      color: #fff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .brand h1 {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.7px;
      color: #fff;
      line-height: 1.15;
    }
    .brand p {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.2px;
      margin-top: -4px;
    }

    /* ---- Portal cards ---- */
    .portals {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .portal {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 18px;
      border-radius: 22px;
      text-decoration: none;
      color: #fff;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 12px 30px -12px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.14);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      min-height: 78px;
    }

    /* colored left accent bar */
    .portal::before {
      content:'';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      border-radius: 22px 0 0 22px;
    }
    .portal.school::before   { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
    .portal.staff::before    { background: linear-gradient(180deg, #2dd4bf, #0d9488); }
    .portal.guardian::before { background: linear-gradient(180deg, #fbbf24, #d97706); }

    .portal:active {
      transform: scale(0.975);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 6px 18px -8px rgba(0,0,0,0.55);
    }

    .portal:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 3px;
    }

    /* icon */
    .portal .icon {
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      box-shadow:
        0 8px 16px -6px rgba(0,0,0,0.35),
        inset 0 1.5px 2px rgba(255,255,255,0.35);
      position: relative;
    }
    .portal.school .icon {
      background: linear-gradient(145deg, #3b82f6, #1e40af);
    }
    .portal.staff .icon {
      background: linear-gradient(145deg, #14b8a6, #0f766e);
    }
    .portal.guardian .icon {
      background: linear-gradient(145deg, #f59e0b, #b45309);
    }

    /* text */
    .portal .text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .portal .text h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
      line-height: 1.2;
    }
    .portal .text span {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* arrow */
    .portal .arrow {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .portal:active .arrow {
      background: rgba(255,255,255,0.2);
      color: #fff;
      transform: translateX(3px);
    }

    /* ---- Footer ---- */
    .footer {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.3px;
      padding-top: 4px;
    }
    .footer i {
      margin-right: 5px;
      font-size: 11px;
      color: rgba(96,165,250,0.9);
    }

    /* small-screen fine tuning */
    @media (max-width: 360px) {
      .landing { gap: 24px; }
      .brand h1 { font-size: 24px; }
      .logo-badge { width: 64px; height: 64px; border-radius: 20px; }
      .logo-badge i { font-size: 30px; }
      .portal { padding: 15px 15px; gap: 13px; min-height: 72px; }
      .portal .icon { width: 48px; height: 48px; font-size: 21px; border-radius: 15px; }
      .portal .text h2 { font-size: 15.5px; }
      .portal .text span { font-size: 11.5px; }
    }

    /* very short screens (landscape small phones) */
    @media (max-height: 640px) {
      .landing { gap: 20px; }
      .brand { gap: 10px; }
      .logo-badge { width: 60px; height: 60px; border-radius: 18px; }
      .logo-badge i { font-size: 28px; }
      .brand h1 { font-size: 22px; }
      .portals { gap: 11px; }
      .portal { min-height: 68px; padding: 14px 15px; }
      .portal .icon { width: 46px; height: 46px; font-size: 20px; border-radius: 14px; }
      .footer { display: none; }
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      body::before, body::after { animation: none; }
      .portal { transition: none; }
    }
  </style>
</head>
<body>
  <main class="landing" role="main">

    <!-- Brand -->
    <header class="brand">
      <div class="logo-badge" aria-hidden="true">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Choose your portal to sign in</p>
    </header>

    <!-- Portals -->
    <nav class="portals" aria-label="Login portals">

      <!-- School login -->
      <a class="portal school"
         href="https://madar-37496.bubbleapps.io/version-test/school_login?auth=login"
         aria-label="Continue to School login">
        <div class="icon" aria-hidden="true">
          <i class="fa-solid fa-school"></i>
        </div>
        <div class="text">
          <h2>School Login</h2>
          <span>Administration &amp; management</span>
        </div>
        <div class="arrow" aria-hidden="true">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- School staff login -->
      <a class="portal staff"
         href="https://madar-37496.bubbleapps.io/version-test/employee_login?auth=login"
         aria-label="Continue to School staff login">
        <div class="icon" aria-hidden="true">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <div class="text">
          <h2>School Staff Login</h2>
          <span>Teachers &amp; employees</span>
        </div>
        <div class="arrow" aria-hidden="true">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- Guardian login -->
      <a class="portal guardian"
         href="https://madar-37496.bubbleapps.io/version-test/guardian_login?auth=login"
         aria-label="Continue to Guardian login">
        <div class="icon" aria-hidden="true">
          <i class="fa-solid fa-people-roof"></i>
        </div>
        <div class="text">
          <h2>Guardian Login</h2>
          <span>Parents &amp; guardians</span>
        </div>
        <div class="arrow" aria-hidden="true">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

    </nav>

    <footer class="footer">
      <i class="fa-solid fa-lock"></i> Secure login · Powered by EduPortal
    </footer>

  </main>
</body>
</html>
